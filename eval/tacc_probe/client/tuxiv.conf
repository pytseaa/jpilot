entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: proxy
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: jobpilot-probe
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=1
    - time=00:05:00
    - output=${TACC_SLURM_USERLOG}/jobpilot-probe-%j.log
